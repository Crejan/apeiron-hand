[project]
site_name = "Apeiron"
site_description = "Open driver, tooling and protocol specification for the Wuji Hand 2"
docs_dir = "docs"
# Set to the GitHub Pages URL of your fork, e.g. "https://<org>.github.io/apeiron/"
# site_url = "https://apeiron.github.io/apeiron/"
nav = [
  { "Home" = "index.md" },
  { "Specification" = [
    "spec/transport.md",
    "spec/resources.md",
    "spec/messages.md",
    "spec/control.md",
    "spec/errors.md",
    "spec/kinematics.md",
  ] },
  { "Guides" = [
    "guides/getting-started.md",
    "guides/commissioning.md",
    "guides/cli.md",
    "guides/middleware.md",
    "guides/debugging.md",
  ] },
  { "Crates" = "crates.md" },
]

[project.theme]
features = [
  "navigation.sections",
  "navigation.expand",
]
