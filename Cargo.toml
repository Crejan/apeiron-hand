[workspace]
resolver = "2"
members = [
    "crates/apeiron-protocol",
    "crates/apeiron-driver",
    "crates/apeiron-adapter-udp",
    "crates/apeiron-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/apeiron/apeiron"
rust-version = "1.80"

[workspace.dependencies]
apeiron-protocol = { path = "crates/apeiron-protocol", version = "0.1.0" }
apeiron-driver = { path = "crates/apeiron-driver", version = "0.1.0" }
# Pinned to the Zenoh version the hand firmware was validated against.
zenoh = "=1.9.0"
zenoh-codec = "=1.9.0"
zenoh-protocol = "=1.9.0"
zenoh-buffers = "=1.9.0"
postcard = { version = "1.1", features = ["use-std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "sync"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
libc = "0.2"
pcap-parser = "0.17"

[profile.release]
debug = 1
